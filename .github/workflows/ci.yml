# SPDX-FileCopyrightText: Rene Widera
#
# Build and test picBunch on CPU, CUDA, HIP and oneAPI.
#
# Runner assumptions
# ------------------
# cpu:      GitHub-hosted ubuntu-24.04.  Pin the image instead of using
#           ubuntu-latest: the bit-exact regression pins were captured on the
#           GCC 13 / glibc 2.39 / FFTW toolchain of 24.04, and a newer image
#           changes the last bits of the FFT and libm results.  openPMD-api is
#           not packaged for Ubuntu, so this job builds openPMD 0.17.1
#           (HDF5 + MPI) once and caches the install prefix.
# gpu-cuda: GitHub-hosted runner with the nvidia/cuda devel container.  The
#           device code is compiled, not executed: no GPU is attached to a
#           hosted runner.  Runtime CUDA validation is done on the project's
#           GPU hosts.
# gpu-hip:  GitHub-hosted runner with the rocm/dev-ubuntu-24.04 container.
#           Compile only, for the same reason.
# oneapi:   GitHub-hosted runner with the Intel oneAPI container.  The CPU
#           backend is compiled with icpx and the full CPU test suite runs.
#
# The container jobs follow the alpakaVendor CI layout: the toolchain comes from
# the image, the project dependencies come from apt, and openPMD-api is built in
# /tmp inside the job.  This keeps the jobs independent of self-hosted runners
# and of the hosted image roll.

name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'JSON array of CUDA architectures, e.g. ["70","80"]'
        required: false
        default: '["70"]'
      hip_arch:
        description: 'HIP architecture (gfx target)'
        required: false
        default: gfx1100

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # CTests carry TIMEOUT 900 and RESOURCE_LOCK picBunchGpuDevice, so CTest
  # serializes them even when a parallel level is requested.
  CTEST_OPTIONS: --output-on-failure --no-tests=error
  OPENPMD_VERSION: '0.17.1'
  OMPI_MCA_rmaps_base_oversubscribe: '1'

jobs:
  no-direct-hdf5:
    name: guard (no direct HDF5 C API)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Reject H5* calls in library sources
        run: |
          if grep -rnE 'H5[A-Za-z_]*\(' src include; then
            echo "error: direct HDF5 C API calls are forbidden in src/ and include/" >&2
            exit 1
          fi
          echo "no direct HDF5 C API calls in src/ or include/"

  cpu:
    name: cpu (ubuntu-24.04, Release, MPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set openPMD install prefix
        run: echo "OPENPMD_PREFIX=$RUNNER_TOOL_CACHE/openpmd-0.17.1" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config ccache \
            libopenmpi-dev openmpi-bin \
            libhdf5-openmpi-dev libfftw3-dev libgtest-dev \
            python3-h5py python3-pip

      # The chunked tests write their input with the Python openPMD binding.
      # The C++ install above is deliberately built without Python bindings, so
      # take the matching wheel from PyPI.  --no-deps keeps the apt numpy.
      - name: Install openPMD Python bindings
        run: |
          python3 -m pip install --user --break-system-packages --no-deps \
            "openpmd-api==$OPENPMD_VERSION"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpu-${{ runner.os }}-${{ runner.arch }}

      - name: Cache openPMD-api install
        id: openpmd-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/openpmd-${{ env.OPENPMD_VERSION }}
          # The install prefix is not portable across hosted-runner images
          # because the HDF5 openmpi soname changes.  The key names the image
          # and the ABI revision so a 24.04 build is never restored on another
          # image (and vice versa).
          key: openpmd-${{ env.OPENPMD_VERSION }}-hdf5-mpi-v3-ubuntu-24.04-${{ runner.arch }}

      - name: Build openPMD-api (cache miss)
        if: steps.openpmd-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$OPENPMD_VERSION" \
            https://github.com/openPMD/openPMD-api.git /tmp/openpmd-src
          cmake -S /tmp/openpmd-src -B /tmp/openpmd-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$OPENPMD_PREFIX" \
            -DopenPMD_USE_HDF5=ON \
            -DopenPMD_USE_MPI=ON \
            -DopenPMD_USE_ADIOS2=OFF \
            -DopenPMD_USE_PYTHON=OFF \
            -DopenPMD_USE_INVASIVE_TESTS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/openpmd-build -j "$(nproc)"
          cmake --install /tmp/openpmd-build

      - name: Configure (CPU)
        run: |
          cmake -S . -B build/cpu -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPICBUNCH_BUILD_TESTS=ON \
            -DPICBUNCH_BUILD_GTESTS=ON \
            -DPICBUNCH_ENABLE_MPI=ON \
            -DopenPMD_DIR="$OPENPMD_PREFIX/lib/cmake/openPMD"

      - name: Build (CPU)
        run: cmake --build build/cpu -j "$(nproc)"

      - name: Test (CPU)
        run: ctest --test-dir build/cpu $CTEST_OPTIONS

  gpu-cuda:
    name: cuda (container, compile only)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.cuda_arch || vars.CUDA_ARCH || '["70"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build git g++ pkg-config \
            libhdf5-dev libfftw3-dev libgtest-dev python3

      - name: Build openPMD-api
        run: |
          git clone --depth 1 --branch "$OPENPMD_VERSION" \
            https://github.com/openPMD/openPMD-api.git /tmp/openpmd-src
          cmake -S /tmp/openpmd-src -B /tmp/openpmd-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/openpmd-install \
            -DopenPMD_USE_HDF5=ON \
            -DopenPMD_USE_MPI=OFF \
            -DopenPMD_USE_ADIOS2=OFF \
            -DopenPMD_USE_PYTHON=OFF \
            -DopenPMD_USE_INVASIVE_TESTS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/openpmd-build -j "$(nproc)"
          cmake --install /tmp/openpmd-build

      - name: Configure (CUDA)
        run: |
          arch="${{ matrix.arch }}"
          arch="${arch#sm_}"
          cmake -S . -B "build/cuda-${arch}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICBUNCH_ENABLE_CUDA=ON \
            -DPICBUNCH_BUILD_TESTS=ON \
            -DPICBUNCH_BUILD_GTESTS=ON \
            -DPICBUNCH_ARCH="$arch" \
            -DCMAKE_CUDA_ARCHITECTURES="$arch" \
            -DopenPMD_DIR=/tmp/openpmd-install/lib/cmake/openPMD

      - name: Build (CUDA)
        run: |
          arch="${{ matrix.arch }}"; arch="${arch#sm_}"
          cmake --build "build/cuda-${arch}" -j "$(nproc)"

  gpu-hip:
    name: hip (container, compile only)
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-24.04:7.2
    timeout-minutes: 120
    env:
      HIP_ARCH: ${{ inputs.hip_arch || vars.HIP_ARCH || 'gfx1100' }}
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build git g++ pkg-config \
            libopenmpi-dev openmpi-bin libhdf5-openmpi-dev \
            libfftw3-dev libgtest-dev python3 rocfft-dev

      - name: Build openPMD-api
        run: |
          git clone --depth 1 --branch "$OPENPMD_VERSION" \
            https://github.com/openPMD/openPMD-api.git /tmp/openpmd-src
          cmake -S /tmp/openpmd-src -B /tmp/openpmd-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/openpmd-install \
            -DopenPMD_USE_HDF5=ON \
            -DopenPMD_USE_MPI=ON \
            -DopenPMD_USE_ADIOS2=OFF \
            -DopenPMD_USE_PYTHON=OFF \
            -DopenPMD_USE_INVASIVE_TESTS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/openpmd-build -j "$(nproc)"
          cmake --install /tmp/openpmd-build

      - name: Configure (HIP)
        run: |
          cmake -S . -B "build/hip-${HIP_ARCH}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$ROCM_PATH/bin/amdclang++" \
            -DCMAKE_HIP_COMPILER="$ROCM_PATH/bin/amdclang++" \
            -DCMAKE_HIP_ARCHITECTURES="$HIP_ARCH" \
            -DPICBUNCH_ENABLE_HIP=ON \
            -DPICBUNCH_BUILD_TESTS=ON \
            -DPICBUNCH_BUILD_GTESTS=ON \
            -DPICBUNCH_ARCH="$HIP_ARCH" \
            -DCMAKE_PREFIX_PATH="$ROCM_PATH" \
            -DopenPMD_DIR=/tmp/openpmd-install/lib/cmake/openPMD

      - name: Build (HIP)
        run: cmake --build "build/hip-${HIP_ARCH}" -j "$(nproc)"

  oneapi:
    name: oneapi (CPU, compile and test)
    runs-on: ubuntu-latest
    container: intel/oneapi:2026.2.0-devel-ubuntu24.04
    timeout-minutes: 120
    env:
      # The container runs as root; OpenMPI refuses to launch or to
      # initialize a singleton without these two confirmations.
      OMPI_ALLOW_RUN_AS_ROOT: '1'
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libopenmpi-dev openmpi-bin libhdf5-openmpi-dev \
            libfftw3-dev libgtest-dev python3-h5py python3-pip

      - name: Build openPMD-api
        run: |
          git clone --depth 1 --branch "$OPENPMD_VERSION" \
            https://github.com/openPMD/openPMD-api.git /tmp/openpmd-src
          cmake -S /tmp/openpmd-src -B /tmp/openpmd-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/openpmd-install \
            -DopenPMD_USE_HDF5=ON \
            -DopenPMD_USE_MPI=ON \
            -DopenPMD_USE_ADIOS2=OFF \
            -DopenPMD_USE_PYTHON=OFF \
            -DopenPMD_USE_INVASIVE_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            -DMPI_CXX_COMPILER=/usr/bin/mpicxx \
            -DMPIEXEC_EXECUTABLE=/usr/bin/mpiexec
          cmake --build /tmp/openpmd-build -j "$(nproc)"
          cmake --install /tmp/openpmd-build

      - name: Install openPMD Python bindings
        run: |
          python3 -m pip install --break-system-packages --no-deps \
            "openpmd-api==$OPENPMD_VERSION"

      - name: Configure (oneAPI CPU)
        run: |
          . /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true
          cmake -S . -B build/oneapi -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=icpx \
            -DPICBUNCH_BUILD_TESTS=ON \
            -DPICBUNCH_BUILD_GTESTS=ON \
            -DPICBUNCH_ENABLE_MPI=ON \
            -DMPI_CXX_COMPILER=/usr/bin/mpicxx \
            -DMPIEXEC_EXECUTABLE=/usr/bin/mpiexec \
            -DopenPMD_DIR=/tmp/openpmd-install/lib/cmake/openPMD

      - name: Build (oneAPI CPU)
        run: |
          . /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true
          cmake --build build/oneapi -j "$(nproc)"

      - name: Test (oneAPI CPU)
        run: |
          . /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true
          ctest --test-dir build/oneapi $CTEST_OPTIONS
