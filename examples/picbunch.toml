# picBunch placement-interface configuration.
# All physical values are SI unless a key says otherwise.

[picongpu]
# Independent PIConGPU deck inputs. Copy these values 1:1 from the deck that
# will restart the checkpoint; picBunch derives every SI unit factor exactly as
# include/picongpu/unitless/simulation.unitless. Do not transcribe unit_*
# factors: they are derived and no longer part of the schema.
#
# delta_t    = SI::DELTA_T_SI                       (simulation.param)
# cell_size  = SI::CELL_WIDTH/HEIGHT/DEPTH_SI        (simulation.param)
# base_mass  = SI::BASE_MASS_SI                      (speciesConstants.param)
# base_charge= SI::BASE_CHARGE_SI (signed)           (speciesConstants.param)
# base_density = SI::BASE_DENSITY_SI                 (simulation.param)
# typical_particles_per_cell = TYPICAL_PARTICLES_PER_CELL (simulation.param)
delta_t = 1.0e-15
cell_size = [1.0e-7, 1.0e-7, 1.0e-7]
base_mass = 9.1093837139e-31
base_charge = -1.602176634e-19
base_density = 1.0e24
typical_particles_per_cell = 2
# Optional; defaults to the 2022 CODATA value used by the deck.
# speed_of_light = 2.99792458e8

# Checkpoint step; also the file suffix.
step = 0
# "float32" (default) or "float64", applied uniformly to every field and
# particle property record. float64 is only usable with a PIConGPU that can
# convert checkpoint dtypes; stock PIConGPU aborts on double particle records.
precision = "float32"
# Species to read from --input and write into the checkpoint.
species = "electrons"

[domain]
# PIConGPU domain cell counts (one patch per axis).
cells = [64, 64, 64]
# Physical position of domain cell (0,0,0); omit when the domain starts at zero.
origin = [0.0, 0.0, 0.0]

[placement]
# Offset from the domain origin to the bunch centroid, given as a vector.
# The first component is x, then y, then z (PIConGPU notation).
#   offset_unit = "metres"   -> position is metres from the domain origin.
#   offset_unit = "fraction" -> position is 0..1 of the domain extent.
offset_unit = "fraction"
position = [0.5, 0.5, 0.5]
# "bbox" (default) covers only the shifted bunch bounding box and is validated
# for single-rank restarts. "domain" covers the full domain and is the safe
# choice for a multi-rank restart.
patch = "bbox"

[accuracy]
tolerance = 1.0e-3
near_shell = "none"
near_shell_radius = 0.0
near_shell_tile = 0  # 0 = automatic near-set pair-count rule
